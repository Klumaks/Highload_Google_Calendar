<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" width="1440" height="1050" role="img" aria-labelledby="title desc">
<title id="title">Схема проекта Calendar</title>
<desc id="desc">Слева типовой региональный дата-центр, справа Франкфурт. DNS отвечает через резолвер, HTTPS идёт напрямую к VIP. Отдельно показаны служебные запросы, фоновые задания и репликация.</desc>
